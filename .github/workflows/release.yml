# Builds and publishes a release when a version tag (such as 1.2.0) is pushed, with
# artifact attestations so users can verify the files were built from this repository.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check that the tag matches the manifest version
        run: test "$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME"

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the changelog section for this version, without its heading.
          awk -v version="$GITHUB_REF_NAME" '
            /^## / { found = index($0, "## " version " ") == 1; next }
            found
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
